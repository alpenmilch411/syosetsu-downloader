[project]
name = "syosetsu"
version = "0.1.0"
description = "Polite Syosetu (小説家になろう) downloader with txt and EPUB export"
requires-python = ">=3.12"
license = "MIT"
authors = [{ name = "alpenmilch411" }]
readme = "README.md"
dependencies = ["httpx>=0.27", "selectolax>=0.3.21", "pillow>=10"]

[project.urls]
Homepage = "https://github.com/alpenmilch411/syosetsu-downloader"

[project.scripts]
syosetsu = "syosetsu.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/syosetsu"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live: hits the real site (opt-in with -m live)"]
addopts = "-m 'not live'"
